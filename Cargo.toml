[workspace]
members = [".", "topogen_derive"]

[package]
name = "topogen"
version = "0.2.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/drmartinwimmer/topogen"
description = "Deterministic, composable N-dimensional spatial field and map generator"
readme = "README.md"
keywords = ["procedural", "noise", "spatial", "terrain", "map"]
categories = ["game-development", "graphics", "mathematics", "algorithms"]

[features]
noise = ["dep:rand", "dep:rand_pcg"]
image = ["dep:image"]
noise_fn = ["dep:noise", "noise"]
palette = ["image", "dep:palette"]

[dependencies]
image = { version = "0.25", optional = true }
noise = { version = "0.9.0", optional = true }
num-traits = "0.2.18"
palette = { version = "0.7.5", optional = true }
rand = { version = "0.8.5", optional = true }
rand_pcg = { version = "0.10.2", optional = true }
thiserror = "1.0.57"
topogen_derive = { path = "topogen_derive", version = "0.1.0" }

[dev-dependencies]
googletest = "0.14"
tempfile = "3.10"

[workspace.lints.rust]
missing_copy_implementations = "warn"

[workspace.lints.clippy]
# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

# Don't Fail Silently - prevent dropped futures and swallowed errors
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"
ignored_unit_patterns = "warn"

# Don't Do Unsafe Things with Memory
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"
large_stack_arrays = "warn"

# Don't Do Potentially Incorrect Things with Numbers
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
checked_conversions = "warn"
invalid_upcast_comparisons = "warn"

# Don't Do Bad Things That are Easy to Avoid
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
redundant_clone = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"
exit = "warn"
infinite_loop = "warn"
large_types_passed_by_value = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Maintainability & Complexity - keep functions easy to understand
cognitive_complexity = "warn"
too_many_lines = "warn"

[lints]
workspace = true

[[example]]
name = "generate_circle_image"
required-features = ["image"]

[[example]]
name = "render_hex_tile"
required-features = ["image", "palette"]
