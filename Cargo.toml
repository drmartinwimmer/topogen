[workspace]
members = ["topogen_derive"]

[package]
name = "topogen"
version = "0.2.0"
edition = "2021"
description = "Deterministic, composable N-dimensional spatial field and map generator"
repository = "https://github.com/drmartinwimmer/topogen"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
topogen_derive = { path = "topogen_derive", version = "0.1.0" }
image = { version = "0.25", optional = true }
noise = { version = "0.9.0", optional = true }
num-traits = "0.2.18"
palette = { version = "0.7.5", optional = true }
rand = { version = "0.8.5", optional = true }
rand_pcg = { version = "0.3.1", optional = true }
thiserror = "1.0.57"

[dev-dependencies]
googletest = "0.14"
tempfile = "3.10"

[features]
noise = ["dep:rand", "dep:rand_pcg"]
image = ["dep:image"]
noise_fn = ["dep:noise", "noise"]
palette = ["image", "dep:palette"]

[[example]]
name = "generate_circle_image"
required-features = ["image"]

[[example]]
name = "render_hex_tile"
required-features = ["image", "palette"]
