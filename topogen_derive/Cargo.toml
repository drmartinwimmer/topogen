[package]
name = "topogen_derive"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/drmartinwimmer/topogen"
description = "Derive macros for topogen"
readme = "../README.md"
keywords = ["procedural", "derive", "macros", "spatial"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.83"
quote = "1.0.36"
syn = "3.0.10"

[dev-dependencies]
googletest = "0.14"

[lints]
workspace = true
