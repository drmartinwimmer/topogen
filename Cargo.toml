[package]
name = "generative_map"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
image = { version = "0.25", optional = true }
noise = { version = "0.9.0", optional = true }
num-traits = "0.2.18"
palette = { version = "0.7.5", optional = true }
rand = { version = "0.8.5", optional = true }
rand_pcg = { version = "0.3.1", optional = true }
thiserror = "1.0.57"

[dev-dependencies]
tempfile = "3.10"

[features]
image = ["dep:image"]
noise = ["dep:noise", "dep:rand", "dep:rand_pcg"]
palette = ["image", "dep:palette"]

[[example]]
name = "generate_circle_image"
required-features = ["image"]

[[example]]
name = "render_hex_tile"
required-features = ["image", "palette"]
